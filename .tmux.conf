# --- Terminal & colors ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Mouse support (scroll, resize, select panes) ---
set -g mouse on

# --- Sensible indexing ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- More scrollback ---
set -g history-limit 50000

# --- No delay on Esc (important for vim/neovim) ---
set -sg escape-time 0

# --- Vi-style copy mode ---
setw -g mode-keys vi

# --- Status bar: gray instead of green ---
set -g status-style bg=colour240,fg=colour253
set-window-option -g mode-keys vi
set -g mouse on
set-option -g status-style fg=colour136,bg=colour235
